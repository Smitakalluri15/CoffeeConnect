server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coffee_order_management}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

spring.messages.basename=validation-messages

app.jwt.secret=${JWT_SECRET:change-this-secret}
app.jwt.expiration-minutes=${JWT_EXP_MIN:60}

app.admin.email=${ADMIN_EMAIL:admin@coffee.local}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.stream-interval-ms=${ADMIN_STREAM_INTERVAL_MS:5000}

app.user.email=${USER_EMAIL:user@coffee.local}
app.user.password=${USER_PASSWORD:user123}

app.owner.email=${OWNER_EMAIL:owner@coffee.local}
app.owner.password=${OWNER_PASSWORD:owner123}
app.chef.login=${CHEF_LOGIN:chef01}
app.chef.password=${CHEF_PASSWORD:chef12345}
app.waiter.login=${WAITER_LOGIN:waiter01}
app.waiter.password=${WAITER_PASSWORD:waiter12345}

app.booking.default-duration-minutes=${BOOKING_DURATION_MIN:60}

app.frontend.base-url=${FRONTEND_URL:http://localhost:5173}

app.mail.from=${MAIL_FROM:}

app.upload.base-dir=${UPLOAD_BASE_DIR:uploads}

app.payment.online-provider=${PAYMENT_ONLINE_PROVIDER:RAZORPAY}

app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}

app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

app.payment.razorpay.currency=${RAZORPAY_CURRENCY:INR}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.org.hibernate.SQL=warn

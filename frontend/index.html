<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>CoffeeConnect | Discover, Reserve & Order From Artisanal Cafes</title>
    <meta name="title" content="CoffeeConnect | Discover, Reserve & Order From Artisanal Cafes" />
    <meta name="description" content="Discover curated brews, reserve tables at top artisanal cafes, order specialty coffee, and join community food sharing with CoffeeConnect." />
    <meta name="keywords" content="coffee, artisanal coffee, cafes near me, book cafe table, specialty brew, cafe ordering, CoffeeConnect, ShareBite" />
    <meta name="author" content="CoffeeConnect" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://coffeeconnect.app/" />

    <!-- Mobile & PWA Theme -->
    <meta name="theme-color" content="#6F4E37" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CoffeeConnect" />
    <meta property="og:url" content="https://coffeeconnect.app/" />
    <meta property="og:title" content="CoffeeConnect | Discover, Reserve & Order From Artisanal Cafes" />
    <meta property="og:description" content="Discover curated brews, reserve tables at top artisanal cafes, order specialty coffee, and join community food sharing with CoffeeConnect." />
    <meta property="og:image" content="https://coffeeconnect.app/table-types/indoor-standard.webp" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://coffeeconnect.app/" />
    <meta name="twitter:title" content="CoffeeConnect | Discover, Reserve & Order From Artisanal Cafes" />
    <meta name="twitter:description" content="Discover curated brews, reserve tables at top artisanal cafes, order specialty coffee, and join community food sharing with CoffeeConnect." />
    <meta name="twitter:image" content="https://coffeeconnect.app/table-types/indoor-standard.webp" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://coffeeconnect.app/#organization",
          "name": "CoffeeConnect",
          "url": "https://coffeeconnect.app/",
          "description": "Artisanal coffee discovery, table booking, and cafe ordering platform."
        },
        {
          "@type": "WebSite",
          "@id": "https://coffeeconnect.app/#website",
          "url": "https://coffeeconnect.app/",
          "name": "CoffeeConnect",
          "publisher": {
            "@id": "https://coffeeconnect.app/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://coffeeconnect.app/cafes?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
